x-base-bot: &base-bot
  image: ghcr.io/tf2-automatic/bot:12.0.0
  restart: unless-stopped
  depends_on:
    - rabbitmq
    - bot-manager
    - app
    - seaweed
  expose:
    - '3000'
  environment: &rmq-redis-env	
    REDIS_HOST: 'redis'
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    RABBITMQ_HOST: 'rabbitmq'
    RABBITMQ_PORT: 5672
    RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
    RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    RABBITMQ_VHOST: '/'

volumes:
  caddy-data:
  caddy-config:
  rabbitmq:
  redis:
  seaweed-data:
  postgres:

services:
  # HTTPS front door. Setup is mandatory: run `./setup.sh` once (it fills in BOT_DOMAIN in .env).
  # Caddy then gets and renews a Let's Encrypt certificate by itself. Ports 80 and 443 must be
  # reachable from the internet.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:?BOT_DOMAIN is not set. Run ./setup.sh first (it sets up HTTPS and the firewall)}
    volumes:
      - './Caddyfile:/etc/caddy/Caddyfile:ro'
      - 'caddy-data:/data'
      - 'caddy-config:/config'

  rabbitmq:
    image: rabbitmq:3.9.28-management-alpine
    expose:
      - '5672'
    ports:
      - '127.0.0.1:15672:15672' # management UI, this machine only
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - 'rabbitmq:/var/lib/rabbitmq'
    healthcheck:
      test: rabbitmq-diagnostics ping
      interval: 10s 
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 10s

  seaweed-init:
    image: curlimages/curl
    user: root
    # This container waits for seaweed to be ready, then pokes the API
    command: >
      sh -c "
        echo 'Waiting for Filer...';
        until curl -s http://seaweed:8888/ > /dev/null; do sleep 2; done;
        echo 'Creating bucket...';
        curl -X POST http://seaweed:8888/buckets/tf2-automatic/;
        echo 'Done!';
      "

  seaweed:
    image: chrislusf/seaweedfs:4.34
    restart: unless-stopped
    # Points to the mounted config file
    command: 'server -s3 -s3.config=/etc/seaweedfs/s3_config.json -dir=/data -s3.allowEmptyFolder=true'
    ports: # this machine only: the other containers reach seaweed over the Docker network
      - '127.0.0.1:8333:8333' # S3 API
      - '127.0.0.1:9333:9333' # Master UI
      - '127.0.0.1:8888:8888' # Filer UI
    volumes:
      - 'seaweed-data:/data'
      - './s3_config.json:/etc/seaweedfs/s3_config.json:ro' # Mounts your file
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9333/cluster/status"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 0s

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory-policy noeviction
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - redis:/data

  bot-manager:
    image: ghcr.io/tf2-automatic/bot-manager:12.0.0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      <<: *rmq-redis-env
    
  bptf-manager:
    image: ghcr.io/tf2-automatic/bptf-manager:12.0.0
    restart: unless-stopped
    expose:
      - '3000'
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *rmq-redis-env
    
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tf2-automatic}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    expose:
      - '5432'
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  item-service:
    image: ghcr.io/tf2-automatic/item-service:12.0.0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      bot-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"] # Assuming it has a /health endpoint
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    expose:
      - '3000'
    environment:
      <<: *rmq-redis-env
    env_file:
      - './bots/bot1.env'

  app:
    image: ghcr.io/price-o-tron/tf2-bot:master
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      bot-manager:
        condition: service_healthy
      postgres:
        condition: service_healthy
      item-service:
        condition: service_healthy
      bptf-manager:
        condition: service_started
    environment:
      <<: *rmq-redis-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tf2-automatic}
    env_file:
      - '.env'
    ports:
      - '127.0.0.1:8080:3000' # this machine only: Price-o-Tron reaches the app through Caddy over HTTPS
    volumes:
      - './bots:/bot-envs:ro'
  

  # Copy this block for each bot you want to run, but make sure to change the first port, name and the env_file
  bot1:
    <<: *base-bot
    container_name: bot-${BOT1}
    ports:
      - '127.0.0.1:3001:3000' # this machine only
    env_file: 
      - './bots/bot1.env'